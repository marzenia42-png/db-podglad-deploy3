<!-- WYGASZENIE /moja-oferta/ (BETI 18.10): jeden koszyk = window.DBMOffer (offer.js wpinany globalnie przez footer.js).
     offer.js przy starcie migruje stary klucz `db_oferta` → `dbm_offer_v1` (klient nie traci pozycji) i otwiera panel.
     Ta strona nie renderuje już własnej listy ani mailto/PDF — to robi panel. -->
<script>
(function(){
  function openWhenReady(auto){
    var tries=0;
    (function wait(){
      if (window.DBMOffer && typeof window.DBMOffer.open==='function'){ window.DBMOffer.open(); return; }
      if (tries++ < 60) setTimeout(wait,100);
    })();
  }
  var btn=document.getElementById('moOpen');
  if (btn) btn.addEventListener('click',function(){ openWhenReady(false); });
  // auto-otwarcie panelu po wejściu na /moja-oferta/
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ openWhenReady(true); });
  else openWhenReady(true);
})();
</script>
