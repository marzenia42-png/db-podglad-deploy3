.m-hero--wyspa .m-eyebrow{color:var(--gold)}

.m-hero--wyspa p{color:#ECE3D2;opacity:.94}
/* FAQ + kontakt na hubie (Dario 25.09, huby FULL) */
.m-faq-list{display:flex;flex-direction:column;gap:10px}
.m-faq-item{border:1px solid var(--line);border-radius:10px;padding:2px 16px;background:rgba(255,255,255,.015)}
.m-faq-item summary{cursor:pointer;padding:14px 0;font-size:15.5px;font-weight:500;list-style:none}
.m-faq-item summary::-webkit-details-marker{display:none}
.m-faq-item summary::after{content:"+";float:right;color:var(--gold);font-size:20px;line-height:1}
.m-faq-item[open] summary::after{content:"–"}
.m-faq-a{padding:0 0 14px;font-size:14.5px;line-height:1.6;opacity:.85;max-width:80ch}
.m-kontakt-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.m-kontakt-i{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit;background:rgba(255,255,255,.015)}

@media(max-width:768px){.m-kontakt-row{grid-template-columns:1fr}}
